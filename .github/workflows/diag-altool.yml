name: Diag altool auth (temporary)

# Fast, build-free probe of the altool "Failed to generate JWT token … isn't in
# the correct format (259)" error. Runs on macos-15 (working Xcode 16 altool)
# and tests App Store Connect API-key auth with the raw decoded .p8 vs a
# re-canonicalised PEM, printing byte/encoding diagnostics. Delete once the
# release-ios upload is fixed.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Probe altool API-key auth
        run: |
          set -uo pipefail
          xcodebuild -version || true
          kid="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          iss="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          echo "::add-mask::$kid"; echo "::add-mask::$iss"
          echo "key_id length=${#kid}  issuer length=${#iss}"

          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | openssl base64 -d -A > raw.p8
          echo "=== raw.p8 ==="
          echo "bytes=$(wc -c < raw.p8 | tr -d ' ')"
          echo "first line: $(head -1 raw.p8)"
          echo "last line:  $(tail -1 raw.p8)"
          printf 'valid UTF-8? '; iconv -f UTF-8 -t UTF-8 raw.p8 >/dev/null 2>&1 && echo YES || echo NO
          echo "head hex:"; head -c 48 raw.p8 | xxd
          echo "tail hex:"; tail -c 48 raw.p8 | xxd

          echo "=== re-canonicalise via openssl pkey ==="
          if openssl pkey -in raw.p8 -out clean.p8 2>err.txt; then
            echo "openssl pkey OK"
          else
            echo "openssl pkey FAILED:"; cat err.txt
          fi
          if [ -s clean.p8 ]; then
            echo "clean.p8 bytes=$(wc -c < clean.p8 | tr -d ' ')"
            echo "clean first line: $(head -1 clean.p8)"
            printf 'clean valid UTF-8? '; iconv -f UTF-8 -t UTF-8 clean.p8 >/dev/null 2>&1 && echo YES || echo NO
          fi

          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"

          echo "=========================================================="
          echo "=== altool auth test with RAW key ==="
          cp raw.p8 "$keydir/AuthKey_${kid}.p8"; chmod 600 "$keydir/AuthKey_${kid}.p8"
          xcrun altool --notarization-history 0 --apiKey "$kid" --apiIssuer "$iss" 2>&1 | head -30 || true

          echo "=========================================================="
          echo "=== altool auth test with CLEAN (re-canonicalised) key ==="
          if [ -s clean.p8 ]; then
            cp clean.p8 "$keydir/AuthKey_${kid}.p8"; chmod 600 "$keydir/AuthKey_${kid}.p8"
            xcrun altool --notarization-history 0 --apiKey "$kid" --apiIssuer "$iss" 2>&1 | head -30 || true
          else
            echo "(no clean.p8 to test)"
          fi
          echo "=== done ==="
