name: Release iOS (TestFlight / App Store)

# Manual only — App Store / TestFlight uploads should be intentional, not fired
# on every push. Pick the lane when you dispatch:
#   • beta    → build + sign, then upload to App Store Connect (appears in TestFlight)
#   • release → build + sign, then upload to App Store Connect (finish metadata & submit in ASC)
#   • certs   → one-time bootstrap: create signing cert + profile in the match repo
#
# beta and release do the same thing here (both upload the signed binary to App
# Store Connect); the binary is then available for TestFlight testing AND for an
# App Store submission you finish in the ASC UI.
#
# WHY TWO JOBS: the app must be BUILT on macos-26 (Xcode 26 / iOS 26 SDK — an
# older SDK fails to compile the iOS 26 SwiftUI it uses). But every altool on the
# macos-26 image (all Xcode 26.x) is broken: it can't parse the App Store Connect
# API key when generating its auth JWT ("… isn't in the correct format. (259)"),
# and iTMSTransporter there is a stub. So we build+sign on macos-26 and upload the
# signed .ipa on macos-15, whose Xcode 16 altool authenticates with the API key
# correctly.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64             base64 of the .p8 key file  (base64 -i AuthKey_XXX.p8)
#   MATCH_PASSWORD                passphrase that encrypts the match repo
#   MATCH_GIT_URL                 https URL of a PRIVATE repo that stores signing assets
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to run"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - release
          - certs

# `contents: write` so the build job's GITHUB_TOKEN can push match's encrypted
# signing assets back to this repo (MATCH_GIT_URL points at this same repository
# — see the "Normalise match git credentials" step). Without write, match mints a
# new distribution certificate on every run but can never persist it, which both
# exhausts Apple's 2-cert cap and leaves the read-only build from finding an
# identity.
permissions:
  contents: write

jobs:
  build:
    name: Build & sign (${{ inputs.lane }})
    # macos-26 ships Xcode 26 (iOS 26 SDK). The codebase uses iOS 26 SwiftUI
    # APIs to compile even though the deployment target is iOS 18, so an older
    # runner (Xcode 16 / iOS 18 SDK) would fail with exit code 65.
    runs-on: macos-26

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      # MATCH_GIT_BASIC_AUTHORIZATION is intentionally NOT set here — it is
      # derived from the job's GITHUB_TOKEN in "Normalise match git credentials"
      # (the stored PAT is read-only and can't persist signing assets).
      # Deterministic, English locale so fastlane/xcodebuild parse cleanly.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (26 / iOS 26 SDK)
        run: |
          set -e
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1 || echo "")
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Fail fast if signing secrets are missing
        run: |
          set -e
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 MATCH_PASSWORD MATCH_GIT_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing — add them in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up Ruby + fastlane (bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Authenticate match's git storage with the job's GITHUB_TOKEN.
      #
      # MATCH_GIT_URL points at THIS repository (the encrypted signing assets are
      # stored here on the `master` branch). The PAT in
      # MATCH_GIT_BASIC_AUTHORIZATION could clone (read) but not push (write) —
      # match's attempt to persist a freshly-created distribution certificate
      # failed with HTTP 403 "Permission … denied", so every run re-minted a
      # certificate that was never saved (exhausting Apple's 2-cert cap) and the
      # read-only build found no identity. The job's GITHUB_TOKEN has write access
      # to this repo via `permissions: contents: write`, so use it for both clone
      # and push. `x-access-token:<token>` is the form GitHub expects; re-encode
      # as clean single-line base64 that match sends verbatim. MATCH_GIT_URL is
      # stripped of stray whitespace (a baked-in newline otherwise corrupts the
      # URL). openssl is always present on the runner.
      - name: Normalise match git credentials
        env:
          RAW_URL: ${{ secrets.MATCH_GIT_URL }}
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(printf '%s' "$RAW_URL" | tr -d '[:space:]')"
          echo "::add-mask::$url"
          echo "MATCH_GIT_URL=$url" >> "$GITHUB_ENV"

          creds="x-access-token:${GH_PUSH_TOKEN}"
          clean="$(printf '%s' "$creds" | openssl base64 -A)"
          echo "::add-mask::$clean"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$clean" >> "$GITHUB_ENV"

      # certs → bootstrap signing assets and stop. beta/release → build + sign the
      # .ipa (the upload runs in the separate macos-15 job below).
      - name: Run fastlane (build or certs)
        run: |
          set -e
          if [ "${{ inputs.lane }}" = "certs" ]; then
            bundle exec fastlane certs
          else
            bundle exec fastlane build_only
          fi

      - name: Upload signed IPA artifact
        if: ${{ inputs.lane != 'certs' }}
        uses: actions/upload-artifact@v4
        with:
          name: kinematic-ipa
          path: build/Kinematic.ipa
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload to App Store Connect (macos-15)
    needs: build
    # certs bootstraps signing only — nothing to upload.
    if: ${{ inputs.lane != 'certs' }}
    # macos-15 ships Xcode 16, whose altool authenticates with an App Store
    # Connect API key correctly (Xcode 26's altool cannot — it fails JWT
    # generation with error 259). It just transfers the already-signed binary.
    runs-on: macos-15

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Download signed IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: kinematic-ipa
          path: ipa

      - name: Upload to App Store Connect via altool
        run: |
          set -euo pipefail
          ipa="$(ls ipa/*.ipa | head -n1)"
          echo "Uploading $ipa"
          kid="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          iss="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          key="$keydir/AuthKey_${kid}.p8"
          # The ASC_KEY_P8_BASE64 secret decodes to the key's DER (binary) form.
          # Ruby/OpenSSL and spaceship read DER fine (match + signing work), but
          # altool reads AuthKey_<id>.p8 as a UTF-8 text PEM and throws
          # "Failed to generate JWT token: … isn't in the correct format. (259)"
          # on binary input — regardless of Xcode version. Convert to a clean PEM
          # (and accept an already-PEM secret too, for robustness).
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '[:space:]' | openssl base64 -d -A > raw.key
          if openssl pkey -in raw.key -out "$key" 2>/dev/null; then
            echo "API key secret was PEM"
          elif openssl pkey -inform DER -in raw.key -out "$key" 2>/dev/null; then
            echo "API key secret was DER — converted to PEM"
          else
            echo "::error::Could not parse ASC_KEY_P8_BASE64 as a PEM or DER private key"
            exit 1
          fi
          rm -f raw.key
          chmod 600 "$key"
          echo "key header: $(head -1 "$key")"
          xcodebuild -version
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$kid" --apiIssuer "$iss"
